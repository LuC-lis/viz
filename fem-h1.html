<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>有限元方法：分片线性函数 (H1 空间) 3D 演示</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: white; font-family: sans-serif; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            max-width: 400px;
            line-height: 1.5;
        }
        .highlight { color: #4da6ff; font-weight: bold; }
        .smooth { color: #ff4d4d; font-weight: bold; }
    </style>
    <!-- 使用 Import Map 引入 Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">
        <h3>分片线性函数 vs 光滑曲面</h3>
        <p>
            <span class="highlight">蓝色网格曲面</span>：代表有限元中的“分片线性函数”。它在单元内部是平的，交界处有“折角”（一阶导数不连续，二阶导数不存在）。<br>
            <span class="smooth">红色半透明曲面</span>：代表真实的、需要二阶导数的光滑解。<br>
            <em>结论：</em>弱形式降低了要求，让粗糙的蓝色拼接面能够合法地逼近红色曲面（属于 \(H^1\) 空间）。
        </p>
        <p style="font-size: 0.9em; color: #aaa;">操作：鼠标左键旋转，滚轮缩放，右键平移</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. 初始化场景、相机、渲染器
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x111111, 10, 50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 15, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 2. 添加控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // 防止看到地下

        // 3. 添加灯光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);
        
        const dirLight2 = new THREE.DirectionalLight(0x4da6ff, 1);
        dirLight2.position.set(-10, 10, -10);
        scene.add(dirLight2);

        // 4. 创建一个“分片线性”的凹凸曲面 (模拟有限元网格)
        // 使用 PlaneGeometry 分段，并修改顶点高度
        const width = 20;
        const segments = 10; // 分割成 10x10 的小块
        const geometry = new THREE.PlaneGeometry(width, width, segments, segments);
        
        // 遍历顶点，将其 Z 轴高度随机或按特定规律修改
        const positionAttribute = geometry.attributes.position;
        const vertex = new THREE.Vector3();
        for (let i = 0; i < positionAttribute.count; i++) {
            vertex.fromBufferAttribute(positionAttribute, i);
            
            // 制造一个起伏的地形 (使用正弦函数加上一点随机噪点)
            const x = vertex.x;
            const y = vertex.y;
            // 模拟高度变化
            let z = Math.sin(x * 0.5) * Math.cos(y * 0.5) * 2;
            // 加上一点随机性，让折角更明显
            z += (Math.random() - 0.5) * 1.0; 
            
            positionAttribute.setZ(i, z);
        }
        // 必须更新法线，光照才正确。注意：这里计算出的法线依然是平滑的，所以要用 flatShading
        geometry.computeVertexNormals();

        // 材质：flatShading: true 是关键！它会让每个小三角形面片看起来是纯平的，暴露出“折角”。
        const material = new THREE.MeshStandardMaterial({
            color: 0x4da6ff,
            flatShading: true, // 强制平面着色，展示“分片”效果
            side: THREE.DoubleSide,
            roughness: 0.6,
            metalness: 0.2
        });

        const mesh = new THREE.Mesh(geometry, material);
        mesh.rotation.x = -Math.PI / 2; // 放平
        mesh.position.y = 2;
        scene.add(mesh);

        // 添加白色线框，展示“单元边缘”（折角发生的地方）
        const wireframeGeo = new THREE.WireframeGeometry(geometry);
        const wireframeMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
        const wireframe = new THREE.LineSegments(wireframeGeo, wireframeMat);
        wireframe.rotation.x = -Math.PI / 2;
        wireframe.position.y = 2.01; // 稍微往上提一点防止 Z-fighting (闪烁)
        scene.add(wireframe);

        // 5. 创建一个光滑的参考曲面（代表理论上的连续解）
        // 使用 SphereGeometry 或较密的 PlaneGeometry
        const smoothGeo = new THREE.SphereGeometry(6, 64, 64, 0, Math.PI * 2, 0, Math.PI / 2);
        const smoothMat = new THREE.MeshPhysicalMaterial({
            color: 0xff4d4d,
            transparent: true,
            opacity: 0.15,
            roughness: 0.1,
            transmission: 0.5, // 玻璃质感
            side: THREE.DoubleSide
        });
        const smoothMesh = new THREE.Mesh(smoothGeo, smoothMat);
        smoothMesh.position.y = -2;
        scene.add(smoothMesh);

        // 添加一些网格辅助线，增强空间感
        const gridHelper = new THREE.GridHelper(30, 30, 0x444444, 0x222222);
        gridHelper.position.y = -6;
        scene.add(gridHelper);

        // 6. 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // 让曲面缓慢自转，方便观察各个角度的折角
            // mesh.rotation.z += 0.001;
            // wireframe.rotation.z += 0.001;

            renderer.render(scene, camera);
        }

        // 处理窗口缩放
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
